# Minimal local Supabase configuration.
# Run `supabase start` for a local stack, or `supabase link` to a hosted project.

project_id = "two-couple-app"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true

[auth]
enabled = true
site_url = "twocouple://"
additional_redirect_urls = ["twocouple://auth-callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.notify-partner]
verify_jwt = false
